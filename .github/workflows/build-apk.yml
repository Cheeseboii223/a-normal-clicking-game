name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate project root (finds package.json wherever it landed)
        id: find
        run: |
          dir=$(dirname "$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' | head -n 1)")
          if [ -z "$dir" ]; then
            echo "Could not find package.json anywhere in the repo!" >&2
            exit 1
          fi
          echo "Found project root: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        working-directory: ${{ steps.find.outputs.dir }}
        run: npm install

      - name: Add Android platform (if not already present)
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: ${{ steps.find.outputs.dir }}
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
