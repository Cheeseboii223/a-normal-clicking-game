name: A Normal Cliking Game

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer, Cython, and pinned setuptools/pip
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70.0.0"
          pip install Cython==0.29.33 buildozer

      - name: Build APK (Clean Build)
        run: |
          PROJECT_DIR=$(dirname $(find . -name buildozer.spec | head -n 1))
          echo "Found game files in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # Wipe existing cached build directories to prevent Python 3.14 contamination
          rm -rf .buildozer
          
          yes | buildozer -v android debug
          
          cd $GITHUB_WORKSPACE
          mkdir -p bin
          cp "$PROJECT_DIR/bin/"*.apk ./bin/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A Normal Cliking Game
          path: bin/*.apk
