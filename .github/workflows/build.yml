name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install Cython==0.29.33 buildozer

      - name: Build APK (Auto-Find Folder)
        run: |
          # 1. Find the exact folder containing your buildozer.spec
          PROJECT_DIR=$(dirname $(find . -name buildozer.spec | head -n 1))
          echo "Found game files hiding in: $PROJECT_DIR"
          
          # 2. Go into that folder and run Buildozer, automatically saying YES to all licenses
          cd "$PROJECT_DIR"
          yes | buildozer -v android debug
          
          # 3. Move the resulting APK back to the main workspace root
          cd $GITHUB_WORKSPACE
          mkdir -p bin
          cp "$PROJECT_DIR/bin/"*.apk ./bin/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
